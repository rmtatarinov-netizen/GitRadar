version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gitradar_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: gitradar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: gitradar_app
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - .:/app
    command: python -m src.main

volumes:
  postgres_data:
