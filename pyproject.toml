[tool.poetry]
name = "trend-radar"
version = "0.1.0"
description = "GitHub parser for AI agent skills base"
authors = ["Your Name <you@example.com>"]

[tool.poetry.dependencies]
python = "^3.11"
aiogram = "^3.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0"}
asyncpg = "^0.28"
httpx = "^0.24"
pydantic = "^2.0"
